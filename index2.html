<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connectez-vous à votre compte XXL Fourniture. Accédez à vos commandes, favoris et profils personnalisés.">
    <meta name="keywords" content="connexion, compte, login, XXL Fourniture, espace client">
    <title>Connexion - XXL Fourniture</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="image/favicon.ico">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="style2.css" as="style">
    
    <style>
        /* Améliorations CSS pour la page de connexion */
        .login-container {
            min-height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-left {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-left:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo i {
            font-size: 3rem;
            color: #2e1457;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .input-with-icon {
            position: relative;
            transition: all 0.3s ease;
        }

        .input-with-icon input {
            width: 100%;
            padding: 15px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fff;
        }

        .input-with-icon input:focus {
            border-color: #2e1457;
            box-shadow: 0 0 0 3px rgba(46, 20, 87, 0.1);
            outline: none;
            transform: translateY(-2px);
        }

        .input-with-icon i:first-child {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            transition: color 0.3s ease;
        }

        .input-with-icon input:focus + i:first-child {
            color: #2e1457;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: #2e1457;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2e1457 0%, #45297a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #45297a 0%, #5a3a8a 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 20, 87, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .social-login {
            margin-top: 2rem;
            text-align: center;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .social-btn.google {
            background: linear-gradient(135deg, #db4437 0%, #ea4335 100%);
        }

        .social-btn.facebook {
            background: linear-gradient(135deg, #4267B2 0%, #365899 100%);
        }

        .social-btn.twitter {
            background: linear-gradient(135deg, #1DA1F2 0%, #0d8bd9 100%);
        }

        .login-right {
            background: linear-gradient(135deg, #2e1457 0%, #45297a 100%);
            position: relative;
            overflow: hidden;
        }

        .login-right::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.1)"/><circle cx="10" cy="60" r="0.5" fill="rgba(255,255,255,0.1)"/><circle cx="90" cy="40" r="0.5" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.3;
        }

        .overlay {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 3rem;
        }

        .signup-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
        }

        .signup-btn:hover {
            background: white;
            color: #2e1457;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }
            
            .login-right {
                display: none;
            }
            
            .login-left {
                margin: 1rem;
                padding: 2rem;
            }
        }

        /* Loading states */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Success/Error states */
        .input-success {
            border-color: #28a745 !important;
        }

        .input-error {
            border-color: #dc3545 !important;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* Accessibility improvements */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="logo">
                <i class="fas fa-user-shield" aria-hidden="true"></i>
                <h1>Mon Identifiant</h1>
            </div>
            <p class="welcome-text">Bienvenue ! Veuillez vous connecter à votre compte.</p>
            
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <div class="input-with-icon">
                        <input type="email" id="email" name="email" placeholder="votre@email.com" required aria-describedby="email-error">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                    </div>
                    <div class="error-message" id="email-error" role="alert"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="input-with-icon">
                        <input type="password" id="password" name="password" placeholder="••••••••" required aria-describedby="password-error" minlength="6">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <i class="fas fa-eye toggle-password" aria-label="Afficher/masquer le mot de passe" tabindex="0" role="button"></i>
                    </div>
                    <div class="error-message" id="password-error" role="alert"></div>
                </div>
                
                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Se souvenir de moi</label>
                    </div>
                    <a href="#reset-password" class="forgot-password">Mot de passe oublié ?</a>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Se connecter</span>
                    <span class="btn-loading" style="display: none;">
                        <i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Connexion...
                    </span>
                </button>
                
                <div class="social-login">
                    <p>Ou connectez-vous avec :</p>
                    <div class="social-icons">
                        <a href="#" class="social-btn google" aria-label="Se connecter avec Google">
                            <i class="fab fa-google" aria-hidden="true"></i>
                        </a>
                        <a href="#" class="social-btn facebook" aria-label="Se connecter avec Facebook">
                            <i class="fab fa-facebook-f" aria-hidden="true"></i>
                        </a>
                        <a href="#" class="social-btn twitter" aria-label="Se connecter avec Twitter">
                            <i class="fab fa-twitter" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>
                
                <p class="signup-link">Pas encore de compte ? <a href="#register" aria-label="Créer un nouveau compte">S'inscrire</a></p>
            </form>
        </div>
        
        <div class="login-right">
            <div class="overlay">
                <h2>Nouveau ici ?</h2>
                <p>Rejoignez notre communauté et profitez de tous nos services exclusifs !</p>
                <button class="signup-btn" onclick="window.location.href='#register'" aria-label="Créer un nouveau compte">S'inscrire</button>
            </div>
        </div>
    </div>

    <script>
        // Éléments DOM
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const togglePassword = document.querySelector('.toggle-password');

        // Fonctionnalité pour afficher/masquer le mot de passe
        function togglePasswordVisibility() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            
            const icon = togglePassword;
            if (type === 'text') {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                icon.setAttribute('aria-label', 'Masquer le mot de passe');
            } else {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                icon.setAttribute('aria-label', 'Afficher le mot de passe');
            }
        }

        // Événements pour le toggle password
        togglePassword.addEventListener('click', togglePasswordVisibility);
        togglePassword.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                togglePasswordVisibility();
            }
        });

        // Validation des champs en temps réel
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        function showError(input, message) {
            const errorElement = document.getElementById(input.id + '-error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            input.classList.add('input-error');
            input.classList.remove('input-success');
        }

        function showSuccess(input) {
            const errorElement = document.getElementById(input.id + '-error');
            errorElement.style.display = 'none';
            input.classList.remove('input-error');
            input.classList.add('input-success');
        }

        function clearValidation(input) {
            const errorElement = document.getElementById(input.id + '-error');
            errorElement.style.display = 'none';
            input.classList.remove('input-error', 'input-success');
        }

        // Validation en temps réel
        emailInput.addEventListener('blur', function() {
            if (this.value.trim() === '') {
                showError(this, 'L\'adresse email est requise');
            } else if (!validateEmail(this.value)) {
                showError(this, 'Veuillez entrer une adresse email valide');
            } else {
                showSuccess(this);
            }
        });

        passwordInput.addEventListener('blur', function() {
            if (this.value.trim() === '') {
                showError(this, 'Le mot de passe est requis');
            } else if (!validatePassword(this.value)) {
                showError(this, 'Le mot de passe doit contenir au moins 6 caractères');
            } else {
                showSuccess(this);
            }
        });

        // Nettoyer la validation lors de la saisie
        emailInput.addEventListener('input', function() {
            if (this.classList.contains('input-error')) {
                clearValidation(this);
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.classList.contains('input-error')) {
                clearValidation(this);
            }
        });

        // Gestion de la soumission du formulaire
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validation finale
            let isValid = true;
            
            if (!validateEmail(emailInput.value)) {
                showError(emailInput, 'Veuillez entrer une adresse email valide');
                isValid = false;
            }
            
            if (!validatePassword(passwordInput.value)) {
                showError(passwordInput, 'Le mot de passe doit contenir au moins 6 caractères');
                isValid = false;
            }
            
            if (!isValid) {
                return;
            }
            
            // Simulation de connexion
            simulateLogin();
        });

        function simulateLogin() {
            const btnText = loginBtn.querySelector('.btn-text');
            const btnLoading = loginBtn.querySelector('.btn-loading');
            
            // Afficher l'état de chargement
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');
            
            // Simulation d'une requête API
            setTimeout(() => {
                // Succès de connexion
                showNotification('Connexion réussie ! Redirection...', 'success');
                
                // Redirection vers la page d'accueil après 2 secondes
                setTimeout(() => {
                    window.location.href = 'index55.html';
                }, 2000);
                
            }, 2000);
        }

        // Fonction de notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.textContent = message;
            
            const colors = {
                success: 'linear-gradient(135deg, #28a745 0%, #20c997 100%)',
                error: 'linear-gradient(135deg, #dc3545 0%, #c82333 100%)',
                info: 'linear-gradient(135deg, #17a2b8 0%, #138496 100%)'
            };
            
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${colors[type]};
                color: white;
                padding: 15px 25px;
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                z-index: 1000;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                font-weight: 600;
                max-width: 300px;
            `;
            
            document.body.appendChild(notification);
            
            // Animation d'entrée
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            // Suppression automatique
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    if (document.body.contains(notification)) {
                        document.body.removeChild(notification);
                    }
                }, 300);
            }, 4000);
        }

        // Amélioration de l'accessibilité
        document.addEventListener('keydown', function(e) {
            // Navigation au clavier
            if (e.key === 'Tab') {
                // Gestion de la navigation par tab
                const focusableElements = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
                const firstFocusableElement = document.querySelector(focusableElements);
                const focusableContent = document.querySelectorAll(focusableElements);
                const lastFocusableElement = focusableContent[focusableContent.length - 1];
                
                if (e.shiftKey) {
                    if (document.activeElement === firstFocusableElement) {
                        lastFocusableElement.focus();
                        e.preventDefault();
                    }
                } else {
                    if (document.activeElement === lastFocusableElement) {
                        firstFocusableElement.focus();
                        e.preventDefault();
                    }
                }
            }
        });

        // Focus automatique sur le premier champ
        window.addEventListener('load', function() {
            emailInput.focus();
        });

        // Gestion des erreurs réseau
        window.addEventListener('online', function() {
            showNotification('Connexion internet rétablie', 'success');
        });

        window.addEventListener('offline', function() {
            showNotification('Connexion internet perdue', 'error');
        });
    </script>
</body>
</html>
